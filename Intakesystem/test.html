<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Apps Script API Test</title>

  <script
    src="https://accounts.google.com/gsi/client"
    async
    defer
    onload="initializeGoogle()">
  </script>
</head>
<body>
  <h1>Apps Script connection test</h1>

  <button id="connectButton" disabled>
    Connect Google
  </button>

  <form id="testForm">
    <p>
      <label>
        Test message:
        <input name="message" value="Hello from my website!" required>
      </label>
    </p>

    <button id="submitButton" type="submit" disabled>
      Send to Apps Script
    </button>
  </form>

  <pre id="status" aria-live="polite"></pre>

  <script>
    const CLIENT_ID = "293340614626-0jif414s9al566lfu1memvi4aejbhsli.apps.googleusercontent.com ";
    const DEPLOYMENT_ID = "AKfycbwbE44f77aR6aLZ1U_y60tb6D2iVIvMP_xWA2YRufFPqo5vB68-d8GaMdJHeKgI-NoM";

    const SCOPES =
      "https://www.googleapis.com/auth/userinfo.email";

    let tokenClient;
    let accessToken = null;
    let tokenExpiresAt = 0;

    const connectButton = document.getElementById("connectButton");
    const submitButton = document.getElementById("submitButton");
    const status = document.getElementById("status");

    function initializeGoogle() {
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: SCOPES,

        callback: (response) => {
          if (response.error) {
            accessToken = null;
            submitButton.disabled = true;
            status.textContent =
              response.error_description || response.error;
            return;
          }

          if (!google.accounts.oauth2.hasGrantedAllScopes(
            response, SCOPES
          )) {
            status.textContent =
              "Please grant the requested permissions.";
            return;
          }

          accessToken = response.access_token;
          tokenExpiresAt =
            Date.now() + Number(response.expires_in) * 1000;

          submitButton.disabled = false;
          status.textContent = "Connected. You can send a test.";
        },
error_callback: (error) => {
  console.error("Google OAuth popup error:", error);

  status.textContent =
    "Google authorization failed: " +
    (error.type || "unknown") +
    (error.message ? "\n" + error.message : "");
}
      });

      connectButton.disabled = false;
    }

    connectButton.addEventListener("click", () => {
      tokenClient.requestAccessToken({
        prompt: "select_account"
      });
    });

    document.getElementById("testForm")
      .addEventListener("submit", async (event) => {
        event.preventDefault();

        if (!accessToken ||
            Date.now() >= tokenExpiresAt - 30000) {
          submitButton.disabled = true;
          status.textContent =
            "Click Connect Google to get a fresh access token.";
          return;
        }

        submitButton.disabled = true;
        status.textContent = "Calling Apps Script...";

        const data = Object.fromEntries(
          new FormData(event.currentTarget)
        );

        try {
          const response = await fetch(
            `https://script.googleapis.com/v1/scripts/${DEPLOYMENT_ID}:run`,
            {
              method: "POST",
              headers: {
                Authorization: `Bearer ${accessToken}`,
                "Content-Type": "application/json"
              },
              body: JSON.stringify({
                function: "testConnection",
                parameters: [data]
              })
            }
          );

          const result = await response.json();

          if (!response.ok || result.error) {
            throw new Error(JSON.stringify(
              result.error || result,
              null,
              2
            ));
          }

          status.textContent = JSON.stringify(
            result.response?.result,
            null,
            2
          );
        } catch (error) {
          status.textContent = "Error: " + error.message;
        } finally {
          submitButton.disabled = !accessToken ||
            Date.now() >= tokenExpiresAt - 30000;
        }
      });
  </script>
</body>
</html>
