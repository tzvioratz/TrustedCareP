<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Google OAuth test</title>
</head>
<body>
  <p id="connectionStatus">Loading Google library...</p>

  <div id="authorization" hidden>
    <button id="authorizeButton" type="button">
      Continue with Google
    </button>
  </div>

  <div id="testingStuff" hidden>
    <button id="testScript" type="button">
      Test Apps Script
    </button>

    <pre id="output"></pre>
  </div>

  <script>
    let client;
    let accessToken = null;
    let tokenExpiresAt = 0;

    const STORAGE_KEY = "googleOAuthSession";

    const CLIENT_ID =
      "293340614626-0jif414s9al566lfu1memvi4aejbhsli.apps.googleusercontent.com";

    const DEPLOYMENT_ID =
      "AKfycbwbE44f77aR6aLZ1U_y60tb6D2iVIvMP_xWA2YRufFPqo5vB68-d8GaMdJHeKgI-NoM";

    const SCOPES = [
      "https://www.googleapis.com/auth/userinfo.email",
      "https://www.googleapis.com/auth/spreadsheets",
      "https://www.googleapis.com/auth/drive.readonly"
    ];

    const authorization = document.getElementById("authorization");
    const authorizeButton = document.getElementById("authorizeButton");
    const testingStuff = document.getElementById("testingStuff");
    const testButton = document.getElementById("testScript");
    const connectionStatus = document.getElementById("connectionStatus");
    const output = document.getElementById("output");

    function tokenIsCurrent() {
      return Boolean(accessToken) && Date.now() < tokenExpiresAt;
    }

    function clearSavedToken() {
      try {
        localStorage.removeItem(STORAGE_KEY);
      } catch {
        // Continue even if browser storage is unavailable.
      }
    }

    function requireAuthorization(message) {
      accessToken = null;
      tokenExpiresAt = 0;
      clearSavedToken();

      authorization.hidden = false;
      authorizeButton.disabled = false;

      testingStuff.hidden = true;
      testButton.disabled = true;
      output.textContent = "";

      connectionStatus.textContent =
        message || "Google authorization is required.";
    }

    function showTesting(message) {
      authorization.hidden = true;
      testingStuff.hidden = false;
      testButton.disabled = false;

      connectionStatus.textContent =
        message || "Connected to Google.";
    }

    function saveToken() {
      try {
        localStorage.setItem(
          STORAGE_KEY,
          JSON.stringify({
            accessToken,
            tokenExpiresAt,
            clientId: CLIENT_ID,
            scopes: SCOPES.join(" ")
          })
        );
      } catch {
        // Authorization still works, but will not survive a reload.
      }
    }

    function restoreToken() {
      try {
        const saved = JSON.parse(
          localStorage.getItem(STORAGE_KEY) || "null"
        );

        if (
          !saved ||
          typeof saved.accessToken !== "string" ||
          !saved.accessToken ||
          !Number.isFinite(saved.tokenExpiresAt) ||
          Date.now() >= saved.tokenExpiresAt ||
          saved.clientId !== CLIENT_ID ||
          saved.scopes !== SCOPES.join(" ")
        ) {
          return false;
        }

        accessToken = saved.accessToken;
        tokenExpiresAt = saved.tokenExpiresAt;

        return true;
      } catch {
        return false;
      }
    }

    function initializeOAuth() {
      client = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: SCOPES.join(" "),

        callback: (response) => {
          authorizeButton.disabled = false;

          if (response.error) {
            requireAuthorization(
              "Google authorization failed: " +
              (response.error_description || response.error)
            );
            return;
          }

          if (
            !google.accounts.oauth2.hasGrantedAllScopes(
              response,
              ...SCOPES
            )
          ) {
            requireAuthorization(
              "Please approve all required permissions."
            );
            return;
          }

          const lifetime = Number(response.expires_in);

          if (!response.access_token || !Number.isFinite(lifetime)) {
            requireAuthorization(
              "Google returned an incomplete authorization response."
            );
            return;
          }

          accessToken = response.access_token;

          // Stop using the token 60 seconds before its stated expiration.
          tokenExpiresAt =
            Date.now() + lifetime * 1000 - 60000;

          if (!tokenIsCurrent()) {
            requireAuthorization(
              "Please request a new Google authorization."
            );
            return;
          }

          saveToken();
          showTesting("Connected to Google.");
        },

        error_callback: (error) => {
          requireAuthorization(
            "Google authorization could not finish: " + error.type
          );

          console.error("OAuth popup failure:", error);
        }
      });

      if (restoreToken()) {
        showTesting("Restored your Google connection.");
      } else {
        requireAuthorization();
      }
    }

    authorizeButton.addEventListener("click", () => {
      authorizeButton.disabled = true;
      connectionStatus.textContent =
        "Waiting for Google authorization...";

      try {
        client.requestAccessToken({
          prompt: ""
        });
      } catch (error) {
        requireAuthorization(
          "Unable to start authorization: " + error.message
        );
      }
    });

    testButton.addEventListener("click", async () => {
      if (!tokenIsCurrent()) {
        requireAuthorization(
          "Your Google connection expired. Please reconnect."
        );
        return;
      }

      testButton.disabled = true;
      output.textContent = "Calling Apps Script...";

      try {
        const response = await fetch(
          `https://script.googleapis.com/v1/scripts/${DEPLOYMENT_ID}:run`,
          {
            method: "POST",

            headers: {
              Authorization: `Bearer ${accessToken}`,
              "Content-Type": "application/json"
            },

            body: JSON.stringify({
              function: "testConnection",
              parameters: [{
                message: "Hello from my website!"
              }]
            })
          }
        );

        if (response.status === 401) {
          requireAuthorization(
            "Google rejected the saved authorization. Please reconnect."
          );
          return;
        }

        const result = await response.json();

        // Preserve the full response for troubleshooting.
        output.textContent = JSON.stringify({
          httpStatus: response.status,
          result
        }, null, 2);

      } catch (error) {
        output.textContent = "Request failed: " + error.message;

      } finally {
        testButton.disabled = !tokenIsCurrent();
      }
    });
  </script>

  <script
    src="https://accounts.google.com/gsi/client"
    async
    defer
    onload="initializeOAuth()"
    onerror="document.getElementById('connectionStatus').textContent =
      'Unable to load the Google authorization library. Reload to retry.';">
  </script>
</body>
</html>
