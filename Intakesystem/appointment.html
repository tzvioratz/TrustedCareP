#loading-overlay {

  <script>
  let oauthClient;
  let accessToken = null;
  let tokenExpiresAt = 0;

  const STORAGE_KEY = "googleOAuthSession";

  const CLIENT_ID =
    "293340614626-0jif414s9al566lfu1memvi4aejbhsli.apps.googleusercontent.com";

  const DEPLOYMENT_ID =
    "AKfycbwbE44f77aR6aLZ1U_y60tb6D2iVIvMP_xWA2YRufFPqo5vB68-d8GaMdJHeKgI-NoM";

  const SCOPES = [
    "https://www.googleapis.com/auth/userinfo.email",
    "https://www.googleapis.com/auth/spreadsheets",
    "https://www.googleapis.com/auth/drive.readonly",
    "https://www.googleapis.com/auth/calendar",
    "https://www.googleapis.com/auth/documents",
    "https://www.googleapis.com/auth/script.external_request",
    "https://www.googleapis.com/auth/script.send_mail"
    
  ];

  const authOverlay = document.getElementById("auth-overlay");
  const authorizeButton = document.getElementById("authorizeButton");
  const connectionStatus = document.getElementById("connectionStatus");
  const pageContent = document.getElementById("pageContent");

  let oauthInitialized = false;
  let authorizationWaiters = [];

  function tokenIsCurrent() {
    return Boolean(accessToken) && Date.now() < tokenExpiresAt;
  }

  function clearSavedToken() {
    try {
      localStorage.removeItem(STORAGE_KEY);
    } catch {}
  }

  function requireAuthorization(message) {
    accessToken = null;
    tokenExpiresAt = 0;
    clearSavedToken();

    pageContent.inert = true;
    authOverlay.hidden = false;
    authorizeButton.disabled = !oauthInitialized;

    connectionStatus.textContent =
      message || "Authorize with Google to continue.";
  }

  function finishAuthorization() {
    authOverlay.hidden = true;
    pageContent.inert = false;
    authorizeButton.disabled = false;

    const waiting = authorizationWaiters;
    authorizationWaiters = [];

    waiting.forEach(resolve => resolve());
  }

  function saveToken() {
    try {
      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify({
          accessToken,
          tokenExpiresAt,
          clientId: CLIENT_ID,
          scopes: SCOPES.join(" ")
        })
      );
    } catch {}
  }

  function restoreToken() {
    try {
      const saved = JSON.parse(
        localStorage.getItem(STORAGE_KEY) || "null"
      );

      if (
        !saved ||
        typeof saved.accessToken !== "string" ||
        !saved.accessToken ||
        !Number.isFinite(saved.tokenExpiresAt) ||
        Date.now() >= saved.tokenExpiresAt ||
        saved.clientId !== CLIENT_ID ||
        saved.scopes !== SCOPES.join(" ")
      ) {
        return false;
      }

      accessToken = saved.accessToken;
      tokenExpiresAt = saved.tokenExpiresAt;

      return true;
    } catch {
      return false;
    }
  }

  function initializeOAuth() {
    oauthClient = google.accounts.oauth2.initTokenClient({
      client_id: CLIENT_ID,
      scope: SCOPES.join(" "),

      callback: (response) => {
        if (response.error) {
          requireAuthorization(
            "Authorization failed: " +
            (response.error_description || response.error)
          );
          return;
        }

        if (
          !google.accounts.oauth2.hasGrantedAllScopes(
            response,
            ...SCOPES
          )
        ) {
          requireAuthorization(
            "Please approve all required permissions."
          );
          return;
        }

        const lifetime = Number(response.expires_in);

        if (!response.access_token || !Number.isFinite(lifetime)) {
          requireAuthorization(
            "Google returned an incomplete authorization response."
          );
          return;
        }

        accessToken = response.access_token;
        tokenExpiresAt = Date.now() + lifetime * 1000 - 60000;

        if (!tokenIsCurrent()) {
          requireAuthorization("Please authorize again.");
          return;
        }

        saveToken();
        finishAuthorization();
      },

      error_callback: (error) => {
        requireAuthorization(
          "Authorization could not finish: " + error.type
        );
      }
    });

    oauthInitialized = true;

    if (restoreToken()) {
      finishAuthorization();
    } else {
      requireAuthorization();
    }
  }

  authorizeButton.addEventListener("click", () => {
    authorizeButton.disabled = true;
    connectionStatus.textContent =
      "Waiting for Google authorization...";

    try {
      oauthClient.requestAccessToken({ prompt: "" });
    } catch (error) {
      requireAuthorization(error.message);
    }
  });

  // Automatic lookups and submissions wait here if login is needed.
  async function waitForAuthorization() {
    if (tokenIsCurrent()) return;

    if (oauthInitialized) {
      requireAuthorization("Authorize with Google to continue.");
    }

    await new Promise(resolve => {
      authorizationWaiters.push(resolve);
    });
  }

  async function callBackend(method, data) {
    await waitForAuthorization();

    const response = await fetch(
      `https://script.googleapis.com/v1/scripts/${DEPLOYMENT_ID}:run`,
      {
        method: "POST",

        headers: {
          Authorization: `Bearer ${accessToken}`,
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          function: "websiteRequest",
          parameters: [method, data]
        })
      }
    );

    if (response.status === 401) {
      requireAuthorization(
        "Your Google connection is no longer valid. Authorize again."
      );

      throw new Error(
        "Authorization is required. After reconnecting, retry the action."
      );
    }

    const result = await response.json();

    if (!response.ok || result.error) {
      const details = result.error?.details?.find(
        item => item.errorMessage
      );

      throw new Error(
        details?.errorMessage ||
        result.error?.message ||
        `Request failed: ${response.status}`
      );
    }

    return result.response?.result;
  }
</script>

function loadTimes() {
  const date = document.getElementById("appointmentDate").value;
  const length = document.querySelector("select[name='lengthMinutes']").value;
  
  document.getElementById("appointmentTime").innerHTML = '<option value="">Select a time</option>';
  document.getElementById("appointmentTime").disabled = true;
  
 

  if (!date || !length) return;


  callBackend("GET", {
  action: "getTimes",
  date,
  length
})
    .then(times => {
      const select = document.getElementById("appointmentTime");
      select.innerHTML = '<option value="">Select a time</option>';
      
        document.getElementById("appointmentTime").disabled = false;

      
      times.forEach(t => {
        const opt = document.createElement("option");
        opt.value = t;
        opt.textContent = formatTime(t);
        select.appendChild(opt);
      });
    })
    .catch(err => {
      console.error(err);
      alert("Error loading available times");
    });
}
  
  function formatTime(t) {
  const [hour, minute] = t.split(":").map(Number);

  let suffix = "AM";
  let displayHour = hour;

  if (hour >= 12) {
    suffix = "PM";
    if (hour > 12) displayHour = hour - 12;
  }

  if (hour === 0) displayHour = 12;

  return `${displayHour}:${minute.toString().padStart(2, "0")} ${suffix}`;
}

    .forEach(f => f.style.display = "none");

  document.getElementById(id).style.display = "block";
}

  // Display the selected form using your existing function.
  showForm(selectedFormId);

  // Fill fields by their name attribute.
  function fillField(formId, fieldName, value) {
    if (value === null || value === "") return;

    const form = document.getElementById(formId);
    const field = form.querySelector(
      `[name="${fieldName}"]`
    );

    if (field) {
      field.value = value;
      field.dispatchEvent(
        new Event("input", { bubbles: true })
      );
      field.dispatchEvent(
        new Event("change", { bubbles: true })
      );
    }
  }

  // Fill the selected form.
  fillField(selectedFormId, "firstName", firstName);
  fillField(selectedFormId, "lastName", lastName);
  fillField(selectedFormId, "phone", phone);

  if (selectedFormId === "bookingForm") {
    fillField("bookingForm", "email", email);
    fillField(
      "bookingForm",
      "lengthMinutes",
      params.get("lengthMinutes")
    );
    fillField(
      "bookingForm",
      "appointmentDate",
      params.get("appointmentDate")
    );
    fillField(
      "bookingForm",
      "teleHealth",
      params.get("teleHealth")
    );
    fillField(
      "bookingForm",
      "extraNotes",
      params.get("extraNotes")
    );

    // Load available times if the date and appointment type
    // were included in the URL.
    if (
      params.has("appointmentDate") &&
      params.has("lengthMinutes")
    ) {
      const requestedTime = params.get("appointmentTime");

      loadTimes();

      // Select the requested time after available times load.
      if (requestedTime) {
        const timeSelect =
          document.getElementById("appointmentTime");

        const observer = new MutationObserver(() => {
          const matchingOption = Array.from(
            timeSelect.options
          ).find(option => option.value === requestedTime);

          if (matchingOption) {
            timeSelect.value = requestedTime;
            observer.disconnect();
          }
        });

        observer.observe(timeSelect, { childList: true });
      }
    }
  }

  if (selectedFormId === "cancelForm") {
    // Your existing appointment loader uses these fields.
    // Call it after filling them instead of waiting for blur.
    if (firstName && lastName && phone) {
      loadAppointments();
    }
  }

  if (selectedFormId === "billingForm") {
    fillField(
      "billingForm",
      "amountPaid",
      params.get("amountPaid")
    );
    fillField(
      "billingForm",
      "paymentMethod",
      params.get("paymentMethod")
    );
  }
 
  if (selectedFormId === "post"){
    fillField(
      "post",
      "clientID",
      params.get("client")
    );
  }
  if (selectedFormId === "accsessForm"){
    fillField(
      "accsessForm",
      "clientID",
      params.get("client")
    );
    
    if (params.get("reason") == 1 ) {
      document.getElementById("accessReason").value = "Post-appointment administration";
    }
    if (params.get("client") !=""){
      document.getElementById('clientInfoContainer').style.display = 'none';
       document.getElementById('clientInfoContainer').querySelectorAll("input").forEach(field => {
    field.required = false;
  });
    }
  }

}());
  
  //if used ID, get first,last,phone
  
  async function loadClientFromURL() {
    
  const params = new URLSearchParams(window.location.search);
  const clientId = params.get("clientId");

  if (!clientId) return;
   //If client ID show loader 
  const loader = document.getElementById('loading-overlay');
  loader.style.display = 'flex';
  const formChoice = (params.get("form") || "booking").toLowerCase();

  const formIds = {
    booking: "bookingForm",
    cancel: "cancelForm",
    billing: "billingForm",
    persc: "perscribeForm",
    access: "accsessForm"
  };

  const formId = formIds[formChoice];

 if (!formId || !document.getElementById(formId)) {
  loader.style.display = "none";
  alert("Invalid form type.");
  return;
}

  showForm(formId);

  try {
    const client = await callBackend("GET", {
  action: "getClient",
  clientId
});

    if (!client) {
      alert("Client not found.");
      return;
    }

    const form = document.getElementById(formId);

    // Update these mappings to match your actual columns A-C.
    const fieldMap = {
      colA: "firstName",
      colB: "lastName",
      colC: "phone"
    };

    for (const [column, fieldName] of Object.entries(fieldMap)) {
      const field = form.querySelector(`[name="${fieldName}"]`);

      if (field && client[column] != null) {
        field.value = client[column];
        field.dispatchEvent(new Event("input", { bubbles: true }));
        field.dispatchEvent(new Event("change", { bubbles: true }));
      }
    }

    if (formId === "cancelForm") {
      loadAppointments();
    }

 } catch (error) {
    console.error("Client lookup failed:", error);
    alert(
      "Unable to load client information.\n\n" + error.message
    );
  } finally {
    loader.style.display = "none";
  }
}

window.addEventListener("DOMContentLoaded", loadClientFromURL);
</script>
