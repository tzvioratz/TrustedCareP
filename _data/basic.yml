title: Patient Demographics

sections:
    - rows:
      - fields:
          - label: First Name
            name: fn
            type: text
            flex: 2
            required: true

          - label: Middle Initial
            name: mi
            type: text
            

          - label: Last Name
            name: ln
            type: text
            flex: 2
            required: true

      - fields:
          - label: Date of Birth
            name: dob
            type: date
            required: true

          - label: Gender
            name: gender
            type: select
            options: [Male, Female]
            required: true
            
          - label: Marital Status
            name: married
            type: select
            options: [Married, Single, Divorced , Widowed]
            required: true            


      - fields:
          - label: Mailing Address
            name: mailing_address
            type: text
            required: true

          - label: City
            name: mailing_city
            type: text
            required: true
            
          - label: State
            name: mailing_state
            type: text
            required: true

          - label: Zip Code
            name: mailing_zip
            type: text
            required: true
            
      - fields:
          - label: Home Phone
            name: home_phone
            type: text
            required: true

          - label: Cell Phone
            name: cell_phone
            type: text
            
          - label: Work Phone
            name: work_phone
            type: text
            

          - label: Email
            name: email
            type: text
            
            
      - fields:
          - label: Preferred Language
            name: language
            type: select
            options: [English, Yiddish, Other]
            required: true

          - label: Who were you referred by?
            name: referred_by
            type: text
            required: true
            
      - fields:
          - label: Patient Occupation/School
            name: occupation
            type: select
            options: [Kollel, Yeshiva, Work, School, Other]
            required: true

          - label: Name of Business/School
            name:  name_of_business
            type: text
            required: true
            
          - label: For how many years? 
            name: years_in_business
            type: number
            required: true
            
