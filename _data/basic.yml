title: Basic Information

sections:
  - title: Personal Info
    rows:
      - fields:
          - label: First Name
            name: entry.1111
            type: text

          - label: Middle Initial
            name: entry.1112
            type: text

          - label: Last Name
            name: entry.1113
            type: text

      - fields:
