<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Book an Appointment</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background-color: #f0f8ff;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
  }

  form {
    background-color: #ffffff;
    padding: 30px 40px;
    border-radius: 10px;
    box-shadow: 0px 5px 15px rgba(0,0,0,0.2);
    width: 350px;
  }

  h2 {
    text-align: center;
    color: #333333;
    margin-bottom: 20px;
  }

  label {
    display: block;
    margin-top: 15px;
    font-weight: bold;
    color: #333333;
  }

  input, textarea, button, select {
    width: 100%;
    padding: 10px;
    margin-top: 5px;
    border-radius: 5px;
    border: 1px solid #ccc;
    box-sizing: border-box;
    font-size: 14px;
  }

  textarea {
    resize: vertical;
    min-height: 60px;
  }

  button {
    background-color: #4da6ff;
    color: white;
    font-weight: bold;
    margin-top: 20px;
    border: none;
    cursor: pointer;
    transition: background-color 0.3s ease;
  }

  button:hover {
    background-color: #3399ff;
  }
  .tabs {
  display: flex;
  gap: 10px;
  margin-bottom: 15px;

}

.tabs button {
  padding: 8px 16px;
  cursor: pointer;
}
.form-wrapper {
  display: flex;
  flex-direction: column; /* 👈 forces vertical stacking */
  align-items: center;
}



</style>
</head>
<body>
<!-- Tabs -->
  <div class="form-wrapper">
<div class="tabs">
  <button onclick="showForm('bookingForm')">Book an Appointment</button>
  <button onclick="showForm('form2')">Cancel an Appointment</button>
  <button onclick="showForm('billingForm')">Record Payment</button>
</div>
<form  id="bookingForm" class="tab-form" method="POST">
  <h2>Book an Appointment</h2>

  <label for="firstName">First Name</label>
  <input name="firstName" placeholder="John" required>

  <label for="lastName">Last Name</label>
  <input name="lastName" placeholder="Doe" required>

  <label for="phone">Phone</label>
  <input type="tel" name="phone" placeholder="123-456-7890" required>

  <label for="email">Email</label>
  <input name="email" type="email" placeholder="email@example.com" required>

    <label for="lengthMinutes">Appointment Type</label>
  <select name="lengthMinutes" required>
    <option ></option>
    <option value="20">Follow Up (20 min)</option>
    <option value="60">Initial Appointment (60 min)</option>
  </select>
  
  <label for="appointmentDate">Appointment Date</label>
<input type="date" name="appointmentDate" id="appointmentDate" required>
  
  
  

<label for="appointmentTime">Time</label>
<select name="appointmentTime" id="appointmentTime" required>
  <option value="">Select a time</option>
</select>
  
  
  
  <label for="teleHealth">Tele-Health</label>
  <select name="teleHealth" id="teleHealth" required>
    <option ></option>
    <option value="No">No</option>
    <option value="Yes">Yes</option>
    
  </select>




  <label for="extraNotes">Additional Notes</label>
  <textarea name="extraNotes" placeholder="Any extra notes..."></textarea>

  <button type="submit">Book Appointment</button>
</form>
    
    
    <!-- Form 3 -->

    <form id="billingForm"  class="tab-form" method="POST" style="display:none;">
  <h2>Record Payment</h2>

  <label for="billFirstName">First Name</label>
  <input name="firstName" id="billFirstName" placeholder="John" required>

  <label for="billLastName">Last Name</label>
  <input name="lastName" id="billLastName" placeholder="Doe" required>

  <label for="billPhone">Phone</label>
  <input type="tel" name="phone" id="billPhone" placeholder="123-456-7890" required>

  <label for="amountPaid">Amount Paid ($)</label>
  <input type="number" name="amountPaid" id="amountPaid" step="0.01" placeholder="0.00" required>

  <label for="paymentMethod">Payment Method</label>
  <select name="paymentMethod" id="paymentMethod" required>
    <option value=""></option>
    <option value="Cash">Cash</option>
    <option value="Credit Card">Credit Card</option>
    <option value="Zelle">Zelle</option>
    <option value="Check">Check</option>
  </select>

  <button type="submit">Submit Payment</button>
</form>
  </div>

<script>
  const API_KEY = "N&ls4d7C$dRf0N1Di2b&7KfaYW&ah^SBy$WT#!xCbhef1jqkc#zPcKO32HGPLlq$O4%DaXeW4!L8ZZlc!RdEgmCrYMmuMkRIq7i^MB*AONX*d83r31F^7$h9D4QxvpTp"
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzHQlsJEihCzjYQRMLkTU8t_WGNpu8fmTDntie1GNEggNb3xa0LDMZplhheh8_SFqPJ/exec";

  document.getElementById("bookingForm").action = SCRIPT_URL;
  document.getElementById("billingForm").action = `${SCRIPT_URL}?action=payBill&key=${encodeURIComponent(API_KEY)}`;
document.getElementById("appointmentDate").addEventListener("change", loadTimes);
document.querySelector("select[name='lengthMinutes']").addEventListener("change", loadTimes);

function loadTimes() {
  const date = document.getElementById("appointmentDate").value;
  const length = document.querySelector("select[name='lengthMinutes']").value;
  
  document.getElementById("appointmentTime").innerHTML = '<option value="">Select a time</option>';
  document.getElementById("appointmentTime").disabled = true;
  
 

  if (!date || !length) return;


  const url = `${SCRIPT_URL}?action=getTimes&date=${date}&length=${length}&key=${encodeURIComponent(API_KEY)}`;
  
  fetch(url)
    .then(res => res.json())
    .then(times => {
      const select = document.getElementById("appointmentTime");
      select.innerHTML = '<option value="">Select a time</option>';
      
        document.getElementById("appointmentTime").disabled = false;

      
      times.forEach(t => {
        const opt = document.createElement("option");
        opt.value = t;
        opt.textContent = formatTime(t);
        select.appendChild(opt);
      });
    })
    .catch(err => {
      console.error(err);
      alert("Error loading available times");
    });
}
  
  function formatTime(t) {
  const [hour, minute] = t.split(":").map(Number);

  let suffix = "AM";
  let displayHour = hour;

  if (hour >= 12) {
    suffix = "PM";
    if (hour > 12) displayHour = hour - 12;
  }

  if (hour === 0) displayHour = 12;

  return `${displayHour}:${minute.toString().padStart(2, "0")} ${suffix}`;
}
  
function showForm(id) {
  document.querySelectorAll(".tab-form")
    .forEach(f => f.style.display = "none");

  document.getElementById(id).style.display = "block";
}
  
</script>

</body>
  
  
</html>
